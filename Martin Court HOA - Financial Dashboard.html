<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Martin Court HOA — Financial Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#f0f2f5}::-webkit-scrollbar-thumb{background:#b0b8c4;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo}=React;
const {BarChart,Bar,PieChart,Pie,Cell,XAxis,YAxis,CartesianGrid,Tooltip,Legend,ResponsiveContainer,AreaChart,Area}=Recharts;

const UNITS=16, CURRENT_DUES=168;
const C={primary:'#1F4E79',accent:'#2E86AB',danger:'#C0392B',warning:'#E67E22',success:'#27AE60',muted:'#95A5A6',dark:'#2C3E50'};
const PC=['#1F4E79','#2E86AB','#27AE60','#E67E22','#C0392B','#8E44AD','#F39C12','#1ABC9C','#BDC3C7','#D35400','#7F8C8D'];

const plData=[{year:'2023',income:8652,expenses:2051},{year:'2024',income:28560,expenses:19796},{year:'2025',income:33768,expenses:43131},{year:'2026 (ann.)',income:30240,expenses:39101}];
const balData=[{period:'Dec 2023',cash:8182,equity:6550},{period:'Dec 2024',cash:18513,equity:15313},{period:'Dec 2025',cash:9151,equity:5951},{period:'Mar 2026',cash:6935,equity:3735}];
const exp2025=[{name:'Water',value:22931,pct:53.2},{name:'Prop Mgmt',value:6300,pct:14.6},{name:'Trash',value:5789,pct:13.4},{name:'Landscaping',value:5207,pct:12.1},{name:'Bank Fees',value:1132,pct:2.6},{name:'Insurance',value:824,pct:1.9},{name:'Other',value:948,pct:2.2}];
const mQ1=[{month:'Jan 26',income:2352,expenses:1642,net:710},{month:'Feb 26',income:2688,expenses:3005,net:-317},{month:'Mar 26',income:2520,expenses:5128,net:-2608}];
const arRows=[{owner:'Pacheco, Mercedes',current:162,d30:168,d60:168,d90:168,over90:0,total:666},{owner:'Lathaphasavang, Nicko',current:162,d30:168,d60:168,d90:0,over90:0,total:498},{owner:'Toller M. & Glass K.',current:162,d30:0,d60:0,d90:0,over90:0,total:162}];
const bva=[{cat:'HOA Dues (Income)',actual:7560,budget:8064},{cat:'Property Mgmt',actual:1575,budget:1575},{cat:'Water',actual:4193,budget:5958},{cat:'Landscaping',actual:1429,budget:1166},{cat:'Trash',actual:974,budget:1349},{cat:'Insurance',actual:623,budget:515},{cat:'Bank Fees',actual:257,budget:280},{cat:'Electric',actual:38,budget:39},{cat:'Prof Fees',actual:200,budget:71},{cat:'Violations',actual:486,budget:0}];

const fmt=function(n){return n<0?'($'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})+')':'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})};
const fmt2=function(n){return n<0?'($'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+')':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};

function Card({children,title,subtitle,style,accent}){
  return <div className="fade-in" style={Object.assign({background:'white',borderRadius:12,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',overflow:'hidden'},style||{})}>
    {accent&&<div style={{height:4,background:accent}}/>}
    {title&&<div style={{padding:'16px 20px 8px'}}><h3 style={{fontSize:15,fontWeight:700,color:C.dark,margin:0}}>{title}</h3>{subtitle&&<p style={{fontSize:12,color:C.muted,margin:'2px 0 0'}}>{subtitle}</p>}</div>}
    <div style={{padding:title?'0 20px 16px':'16px 20px'}}>{children}</div>
  </div>;
}
function Metric({label,value,sub,color,icon}){
  return <div className="fade-in" style={{background:'white',borderRadius:12,padding:'14px 16px',boxShadow:'0 2px 8px rgba(0,0,0,0.05)',borderLeft:'4px solid '+(color||C.primary)}}>
    <div style={{fontSize:11,fontWeight:600,color:C.muted,textTransform:'uppercase',letterSpacing:'.5px'}}>{icon} {label}</div>
    <div style={{fontSize:24,fontWeight:800,color:color||C.primary,margin:'4px 0'}}>{value}</div>
    {sub&&<div style={{fontSize:11,color:C.muted}}>{sub}</div>}
  </div>;
}
function Nav({label,active,onClick,icon}){
  return <button onClick={onClick} style={{padding:'10px 18px',border:'none',borderBottom:active?'3px solid '+C.primary:'3px solid transparent',background:'none',cursor:'pointer',fontSize:13,fontWeight:active?700:400,color:active?C.primary:C.muted,display:'flex',alignItems:'center',gap:6}}><span>{icon}</span>{label}</button>;
}
function Inp({label,value,onChange,prefix,suffix,hint}){
  return <div style={{marginBottom:10}}>
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <label style={{fontSize:12,fontWeight:600,color:'#555',minWidth:180}}>{label}</label>
      <span style={{fontSize:12,color:'#999'}}>{prefix||'$'}</span>
      <input type="number" value={value} onChange={function(e){onChange(Number(e.target.value))}} style={{width:95,padding:'5px 8px',border:'1px solid #ddd',borderRadius:6,fontSize:13,color:'#0000CC',fontWeight:600,outline:'none'}}/>
      <span style={{fontSize:12,color:'#999'}}>{suffix||'/mo'}</span>
    </div>
    {hint&&<div style={{fontSize:11,color:'#aaa',marginLeft:188,marginTop:2}}>{hint}</div>}
  </div>;
}
function CTip({active,payload,label}){
  if(!active||!payload||!payload.length)return null;
  return <div style={{background:'white',border:'1px solid #eee',borderRadius:8,padding:'8px 12px',boxShadow:'0 4px 12px rgba(0,0,0,.1)'}}>
    <div style={{fontWeight:700,fontSize:12,marginBottom:4}}>{label}</div>
    {payload.map(function(p,i){return <div key={i} style={{fontSize:12,color:p.color}}>{p.name}: {fmt(p.value)}</div>})}
  </div>;
}

function Dashboard(){
  const [tab,setTab]=useState('overview');
  const [dues,setDues]=useState(CURRENT_DUES);
  const [pm,setPm]=useState(525);
  const [land,setLand]=useState(401);
  const [trash,setTrash]=useState(487);
  const [water,setWater]=useState(1490);
  const [ins,setIns]=useState(69);
  const [bank,setBank]=useState(93);
  const [elec,setElec]=useState(13);
  const [prof,setProf]=useState(24);
  const [rep,setRep]=useState(83);
  const [tax,setTax]=useState(2);
  const [waterDebt,setWaterDebt]=useState(8000);
  const [payoffMo,setPayoffMo]=useState(18);
  const [savBank,setSavBank]=useState(65);
  const [savLand,setSavLand]=useState(0);
  const [savTrash,setSavTrash]=useState(0);
  const [arRec,setArRec]=useState(1326);

  var wPmt=payoffMo>0?waterDebt/payoffMo:0;
  var tExp=pm+land+trash+water+ins+bank+elec+prof+rep+tax+wPmt;
  var tInc=dues*UNITS;
  var mNet=tInc-tExp;
  var bEven=Math.ceil(tExp/UNITS);
  var adjExp=tExp-savBank-savLand-savTrash;
  var adjBE=Math.ceil(adjExp/UNITS);

  var cats=[
    {name:'Water (Current)',value:water,color:'#2E86AB'},{name:'Property Mgmt',value:pm,color:'#1F4E79'},
    {name:'Trash/Recycling',value:trash,color:'#E67E22'},{name:'Landscaping',value:land,color:'#27AE60'},
    {name:'Water Payoff',value:wPmt,color:'#C0392B'},{name:'Bank Fees',value:bank,color:'#BDC3C7'},
    {name:'Repairs',value:rep,color:'#E74C3C'},{name:'Insurance',value:ins,color:'#8E44AD'},
    {name:'Prof Fees',value:prof,color:'#1ABC9C'},{name:'Electric',value:elec,color:'#F39C12'},
    {name:'Taxes',value:tax,color:'#7F8C8D'},
  ].filter(function(c){return c.value>0}).sort(function(a,b){return b.value-a.value});

  var pieD=cats.map(function(c){return{name:c.name,value:Math.round(c.value)}});
  var perHH=cats.map(function(c){return{name:c.name,perHH:Math.round(c.value/UNITS*100)/100,color:c.color}});

  var schedule=useMemo(function(){
    var ms=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
    var bal=waterDebt;
    return Array.from({length:payoffMo},function(_,i){
      bal=Math.max(0,bal-wPmt);
      return{month:ms[(i+3)%12]+' '+(2026+Math.floor((i+3)/12)),payment:wPmt,remaining:bal,totalW:water+wPmt};
    });
  },[waterDebt,payoffMo,wPmt,water]);

  return <div style={{minHeight:'100vh',background:'#f0f2f5'}}>
    <div style={{background:'linear-gradient(135deg,'+C.primary+','+C.accent+')',color:'white',padding:'24px 32px'}}>
      <div style={{maxWidth:1200,margin:'0 auto'}}>
        <h1 style={{fontSize:26,fontWeight:800,margin:0}}>Martin Court Property Owners Association</h1>
        <h2 style={{fontSize:16,fontWeight:400,margin:'4px 0 0',opacity:.85}}>Financial Dashboard & Budget Planning Tool</h2>
        <div style={{marginTop:8,fontSize:12,opacity:.7}}>Community Meeting — April 2026 | 16 Households | Cash Basis</div>
      </div>
    </div>

    <div style={{background:'white',boxShadow:'0 2px 8px rgba(0,0,0,.06)',position:'sticky',top:0,zIndex:100}}>
      <div style={{maxWidth:1200,margin:'0 auto',display:'flex',overflowX:'auto'}}>
        <Nav label="Overview" icon="📊" active={tab==='overview'} onClick={function(){setTab('overview')}}/>
        <Nav label="Your Dues" icon="💰" active={tab==='breakdown'} onClick={function(){setTab('breakdown')}}/>
        <Nav label="Budget vs Actual" icon="📋" active={tab==='budget'} onClick={function(){setTab('budget')}}/>
        <Nav label="What-If" icon="🔧" active={tab==='whatif'} onClick={function(){setTab('whatif')}}/>
        <Nav label="Savings Plan" icon="✅" active={tab==='plan'} onClick={function(){setTab('plan')}}/>
        <Nav label="Water Payoff" icon="💧" active={tab==='water'} onClick={function(){setTab('water')}}/>
        <Nav label="Collections" icon="📨" active={tab==='collections'} onClick={function(){setTab('collections')}}/>
      </div>
    </div>

    <div style={{maxWidth:1200,margin:'0 auto',padding:'20px 16px'}}>

    {tab==='overview'&&<div>
      <div className="fade-in" style={{background:'#FEF3CD',border:'1px solid #F0C000',borderRadius:10,padding:'14px 20px',marginBottom:20,display:'flex',alignItems:'center',gap:12}}>
        <span style={{fontSize:24}}>⚠️</span>
        <div><div style={{fontWeight:700,fontSize:14,color:C.dark}}>Financial Action Required</div>
        <div style={{fontSize:13,color:'#666',marginTop:2}}>The HOA has been operating at a deficit since 2025. Total equity dropped from $15,313 to $3,735 in 15 months. This dashboard presents the full picture and a concrete plan to restore stability without a significant dues increase.</div></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12,marginBottom:20}}>
        <Metric label="Cash in Bank" value={fmt(6935)} sub="As of March 31, 2026" color={C.warning} icon="🏦"/>
        <Metric label="Net Assets" value={fmt(3735)} sub="Down from $15,313 end of 2024" color={C.danger} icon="📉"/>
        <Metric label="2025 Net Loss" value={fmt(-9363)} sub="Expenses exceeded income" color={C.danger} icon="🔻"/>
        <Metric label="Q1 2026 Net" value={fmt(-2215)} sub="3-month operating loss" color={C.danger} icon="📊"/>
        <Metric label="Unpaid Dues" value={fmt(1326)} sub="3 owners past due" color={C.warning} icon="📨"/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
        <Card title="Income vs Expenses — Year Over Year" subtitle="2025 expense spike driven primarily by water costs" accent={C.primary}>
          <ResponsiveContainer width="100%" height={260}>
            <BarChart data={plData} margin={{top:10,right:10,left:0,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
              <XAxis dataKey="year" fontSize={11}/><YAxis fontSize={11} tickFormatter={function(v){return '$'+(v/1000).toFixed(0)+'K'}}/>
              <Tooltip content={<CTip/>}/><Legend wrapperStyle={{fontSize:12}}/>
              <Bar dataKey="income" name="Income" fill={C.primary} radius={[4,4,0,0]}/>
              <Bar dataKey="expenses" name="Expenses" fill={C.danger} radius={[4,4,0,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </Card>
        <Card title="Cash & Equity Trend" subtitle="Reserves peaked Dec 2024, declining since" accent={C.accent}>
          <ResponsiveContainer width="100%" height={260}>
            <AreaChart data={balData} margin={{top:10,right:10,left:0,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
              <XAxis dataKey="period" fontSize={11}/><YAxis fontSize={11} tickFormatter={function(v){return '$'+(v/1000).toFixed(0)+'K'}}/>
              <Tooltip content={<CTip/>}/><Legend wrapperStyle={{fontSize:12}}/>
              <Area dataKey="cash" name="Cash" fill={C.primary} fillOpacity={0.2} stroke={C.primary} strokeWidth={2}/>
              <Area dataKey="equity" name="Equity" fill={C.success} fillOpacity={0.15} stroke={C.success} strokeWidth={2}/>
            </AreaChart>
          </ResponsiveContainer>
        </Card>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <Card title="2025 Expense Distribution" subtitle="Water alone consumed 53% of all spending" accent={C.danger}>
          <ResponsiveContainer width="100%" height={280}>
            <PieChart><Pie data={exp2025} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={55} outerRadius={95} label={function(e){return e.name+' '+e.pct+'%'}} fontSize={11}>
              {exp2025.map(function(_,i){return <Cell key={i} fill={PC[i]}/>})}</Pie><Tooltip formatter={function(v){return fmt(v)}}/></PieChart>
          </ResponsiveContainer>
        </Card>
        <Card title="Q1 2026 Monthly" subtitle="March hit hardest by water catch-up" accent={C.warning}>
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={mQ1} margin={{top:10,right:10,left:0,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
              <XAxis dataKey="month" fontSize={12}/><YAxis fontSize={11} tickFormatter={function(v){return fmt(v)}}/>
              <Tooltip content={<CTip/>}/><Legend wrapperStyle={{fontSize:12}}/>
              <Bar dataKey="income" name="Income" fill={C.primary} radius={[4,4,0,0]}/>
              <Bar dataKey="expenses" name="Expenses" fill={C.warning} radius={[4,4,0,0]}/>
            </BarChart>
          </ResponsiveContainer>
          <div style={{textAlign:'center',marginTop:8}}>{mQ1.map(function(m,i){return <span key={i} style={{display:'inline-block',margin:'0 12px',fontSize:12}}><strong>{m.month}:</strong> <span style={{color:m.net>=0?C.success:C.danger,fontWeight:700}}>{fmt(m.net)}</span></span>})}</div>
        </Card>
      </div>
      <Card title="Key Findings" style={{marginTop:16}} accent={C.dark}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          {[{i:'💧',t:'Water costs are the #1 driver',d:'$22,931 in 2025. Past-due balance with City of Houston being paid in installments. Current monthly usage ~$1,490.'},
            {i:'📉',t:'Structural deficit ~$10K/year',d:'At $168/mo, dues generate ~$32K/yr but costs are ~$42K. Gap existed before water past-due issue.'},
            {i:'🏦',t:'Cash reserves critically low',d:'$6,935 in bank with -$3,200 unfunded operating reserve. ~9 months of cash at current burn rate.'},
            {i:'💳',t:'Bank fees are excessive',d:'Intuit charges $5.46 per ACH per dues payment. Switching to direct bank ACH saves $780+/year.'}
          ].map(function(f,i){return <div key={i} style={{background:'#f8f9fa',borderRadius:8,padding:'12px 14px'}}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{f.i} {f.t}</div>
            <div style={{fontSize:12,color:'#666',lineHeight:1.5}}>{f.d}</div>
          </div>})}
        </div>
      </Card>
    </div>}

    {tab==='breakdown'&&<div>
      <Card title={'Where Every Dollar of Your $'+dues+' Goes'} subtitle={'Monthly cost per household: '+fmt2(tExp/UNITS)+' across '+cats.length+' categories'} accent={C.primary}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginTop:8}}>
          <div>{perHH.map(function(c,i){return <div key={i} style={{marginBottom:8}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:2}}><span style={{fontWeight:500}}>{c.name}</span><span><strong style={{color:c.color}}>{fmt2(c.perHH)}</strong> <span style={{color:'#aaa'}}>/HH</span></span></div>
            <div style={{background:'#f0f0f0',borderRadius:4,height:20,overflow:'hidden'}}><div style={{width:Math.min(c.perHH/(tExp/UNITS)*100,100)+'%',background:c.color,height:'100%',borderRadius:4,display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:4}}><span style={{fontSize:10,color:'white',fontWeight:600}}>{Math.round(c.perHH/(tExp/UNITS)*1000)/10}%</span></div></div>
          </div>})}</div>
          <div><ResponsiveContainer width="100%" height={300}><PieChart><Pie data={pieD} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={50} outerRadius={100} label={function(e){return e.name+' '+Math.round(e.percent*100)+'%'}} fontSize={11}>{pieD.map(function(_,i){return <Cell key={i} fill={cats[i]?cats[i].color:PC[i]}/>})}</Pie><Tooltip formatter={function(v){return fmt(v)+'/mo'}}/></PieChart></ResponsiveContainer></div>
        </div>
        <div style={{marginTop:16,background:'#f8f9fa',borderRadius:8,padding:14}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,textAlign:'center'}}>
            <div><div style={{fontSize:11,fontWeight:600,color:C.muted}}>COST PER HOUSEHOLD</div><div style={{fontSize:22,fontWeight:800,color:C.danger}}>{fmt2(tExp/UNITS)}</div></div>
            <div><div style={{fontSize:11,fontWeight:600,color:C.muted}}>DUES COLLECTED</div><div style={{fontSize:22,fontWeight:800,color:C.primary}}>{fmt2(dues)}</div></div>
            <div><div style={{fontSize:11,fontWeight:600,color:C.muted}}>MONTHLY GAP</div><div style={{fontSize:22,fontWeight:800,color:mNet>=0?C.success:C.danger}}>{fmt2(dues-tExp/UNITS)}</div></div>
          </div>
        </div>
        <div style={{marginTop:14,background:'#FFF8E1',border:'1px solid #FFE082',borderRadius:8,padding:12,fontSize:12}}><strong>What are "Bank & Processing Fees"?</strong> Stellar Bank Account Analysis Charge ($25.75/mo) + Intuit/QuickBooks ACH fees ($5.46 per transaction per dues payment). With 16 units, those per-transaction fees total ~$67/month.</div>
      </Card>
    </div>}

    {tab==='budget'&&<div>
      <Card title="Q1 2026 — Budget vs Actual" subtitle="January through March performance" accent={C.primary}>
        <ResponsiveContainer width="100%" height={320}>
          <BarChart data={bva} layout="vertical" margin={{top:5,right:20,left:100,bottom:5}}>
            <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
            <XAxis type="number" fontSize={11} tickFormatter={function(v){return fmt(v)}}/>
            <YAxis dataKey="cat" type="category" fontSize={11} width={95}/>
            <Tooltip content={<CTip/>}/><Legend wrapperStyle={{fontSize:12}}/>
            <Bar dataKey="actual" name="Actual" fill={C.primary} radius={[0,4,4,0]}/>
            <Bar dataKey="budget" name="Budget" fill={C.muted} radius={[0,4,4,0]}/>
          </BarChart>
        </ResponsiveContainer>
        <table style={{width:'100%',borderCollapse:'collapse',marginTop:16,fontSize:12}}>
          <thead><tr style={{background:C.primary,color:'white'}}><th style={{padding:'8px 10px',textAlign:'left'}}>Category</th><th style={{padding:'8px 10px',textAlign:'right'}}>Actual</th><th style={{padding:'8px 10px',textAlign:'right'}}>Budget</th><th style={{padding:'8px 10px',textAlign:'right'}}>Variance</th><th style={{padding:'8px 10px',textAlign:'right'}}>Status</th></tr></thead>
          <tbody>{bva.map(function(r,i){var v=r.actual-r.budget;var isI=r.cat.indexOf('Income')>=0;var bad=isI?(v<0):(v>100);return <tr key={i} style={{background:i%2===0?'#f8f9fa':'white'}}>
            <td style={{padding:'7px 10px',fontWeight:500}}>{r.cat}</td><td style={{padding:'7px 10px',textAlign:'right'}}>{fmt(r.actual)}</td><td style={{padding:'7px 10px',textAlign:'right',color:C.muted}}>{fmt(r.budget)}</td>
            <td style={{padding:'7px 10px',textAlign:'right',color:bad?C.danger:C.success,fontWeight:600}}>{(v>=0?'+':'')+fmt(v)}</td>
            <td style={{padding:'7px 10px',textAlign:'right'}}><span style={{background:bad?'#FFC7CE':'#C6EFCE',color:bad?C.danger:C.success,padding:'2px 8px',borderRadius:10,fontSize:11,fontWeight:600}}>{bad?'Over':'OK'}</span></td>
          </tr>})}</tbody>
        </table>
        <div style={{marginTop:12,fontSize:12,color:'#888',lineHeight:1.6}}><strong>Notes:</strong> Jan trash drafted Dec 2025. Feb water = current billing. Mar began past-due catch-up. Prof fee is annual charge. Violation fees billed late March — revenue in Q2.</div>
      </Card>
    </div>}

    {tab==='whatif'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
        <Metric label="Monthly Income" value={fmt(tInc)} sub={UNITS+' x $'+dues} color={C.primary} icon="📈"/>
        <Metric label="Monthly Expenses" value={fmt(Math.round(tExp))} sub={'Break-even: $'+bEven+'/HH'} color={C.danger} icon="📉"/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <Card title="Adjust Dues" accent={C.primary}><div style={{marginTop:8}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}><input type="range" min={150} max={260} value={dues} onChange={function(e){setDues(Number(e.target.value))}} style={{flex:1}}/><span style={{fontSize:28,fontWeight:800,color:'#0000CC'}}>{'$'+dues}</span></div>
          <div style={{fontSize:12,color:C.muted,marginTop:4}}>{dues===CURRENT_DUES?'No change':<span style={{color:dues>CURRENT_DUES?C.success:C.danger}}>{(dues>CURRENT_DUES?'+':'')+(dues-CURRENT_DUES)+'/mo ($'+(dues-CURRENT_DUES)*12+'/yr per HH)'}</span>}</div>
        </div></Card>
        <Card title="Impact" accent={mNet>=0?C.success:C.danger}><div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,textAlign:'center',marginTop:8}}>
          <div><div style={{fontSize:10,color:C.muted}}>ANNUAL INCOME</div><div style={{fontSize:18,fontWeight:700,color:C.primary}}>{fmt(tInc*12)}</div></div>
          <div><div style={{fontSize:10,color:C.muted}}>ANNUAL EXPENSES</div><div style={{fontSize:18,fontWeight:700,color:C.warning}}>{fmt(Math.round(tExp*12))}</div></div>
          <div><div style={{fontSize:10,color:C.muted}}>ANNUAL NET</div><div style={{fontSize:22,fontWeight:800,color:mNet*12>=0?C.success:C.danger}}>{fmt(Math.round(mNet*12))}</div></div>
        </div></Card>
      </div>
      <Card title="Adjust Expenses" subtitle="Edit any line item" style={{marginTop:16}} accent={C.warning}><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginTop:8}}>
        <div><Inp label="Property Mgmt" value={pm} onChange={setPm} hint="LLA Partners — $525/mo"/><Inp label="Landscaping" value={land} onChange={setLand} hint="Saint Clair — ~$401/mo"/><Inp label="Trash" value={trash} onChange={setTrash} hint="Texas Pride — ~$487/mo"/><Inp label="Water (Current)" value={water} onChange={setWater} hint="City of Houston — ~$1,490/mo"/><Inp label="Insurance" value={ins} onChange={setIns} hint="Annual $824 / 12"/></div>
        <div><Inp label="Bank & Processing" value={bank} onChange={setBank} hint="Stellar $26 + Intuit ~$67/mo"/><Inp label="Electric" value={elec} onChange={setElec} hint="NRG — ~$13/mo"/><Inp label="Prof Fees" value={prof} onChange={setProf} hint="~$24/mo avg"/><Inp label="Repairs" value={rep} onChange={setRep} hint="~$83/mo budget"/><Inp label="Water Payoff" value={Math.round(wPmt)} onChange={function(){}} hint={'Edit in Water Payoff tab'}/></div>
      </div></Card>
    </div>}

    {tab==='plan'&&<div>
      <div className="fade-in" style={{background:'linear-gradient(135deg,#E8F5E9,#C8E6C9)',borderRadius:12,padding:'16px 20px',marginBottom:20}}>
        <div style={{fontSize:16,fontWeight:700,color:C.dark}}>Strategy: Minimize Dues Increase Through Cost Optimization</div>
        <div style={{fontSize:13,color:'#555',marginTop:4}}>Pursue savings on fees, vendors, and collections before raising dues.</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
        <Card title="Savings Levers" accent={C.success}><div style={{marginTop:8}}>
          <Inp label="Bank fee savings" value={savBank} onChange={setSavBank} suffix="/mo" hint="Direct ACH eliminates Intuit (~$65/mo)"/>
          <Inp label="Landscaping savings" value={savLand} onChange={setSavLand} suffix="/mo" hint="Rebid — 10-20% ($40-80/mo)"/>
          <Inp label="Trash savings" value={savTrash} onChange={setSavTrash} suffix="/mo" hint="Shop competitors — 5-15%"/>
          <Inp label="AR Recovery" value={arRec} onChange={setArRec} suffix=" total" hint="$1,326 outstanding"/>
          <div style={{marginTop:12,background:'#E8F5E9',borderRadius:8,padding:10,fontSize:13}}><strong>Monthly Savings: </strong><span style={{color:C.success,fontWeight:700,fontSize:16}}>{fmt(savBank+savLand+savTrash)}/mo</span> <span style={{color:'#888'}}>({fmt((savBank+savLand+savTrash)*12)}/yr)</span></div>
        </div></Card>
        <div style={{display:'grid',gridTemplateRows:'1fr 1fr',gap:16}}>
          <Card accent={C.danger}><div style={{textAlign:'center'}}><div style={{fontSize:11,fontWeight:700,color:C.danger,textTransform:'uppercase'}}>Without Savings</div><div style={{fontSize:28,fontWeight:800,color:C.danger,margin:'8px 0'}}>{'$'+bEven+'/mo'}</div><div style={{fontSize:13}}>Increase: <strong>{'+$'+(bEven-CURRENT_DUES)+'/mo'}</strong></div><div style={{fontSize:12,color:C.muted}}>{'+$'+(bEven-CURRENT_DUES)*12+'/yr per HH'}</div></div></Card>
          <Card accent={C.success}><div style={{textAlign:'center'}}><div style={{fontSize:11,fontWeight:700,color:C.success,textTransform:'uppercase'}}>With Savings</div><div style={{fontSize:28,fontWeight:800,color:C.success,margin:'8px 0'}}>{'$'+adjBE+'/mo'}</div><div style={{fontSize:13}}>Increase: <strong style={{color:adjBE>CURRENT_DUES?C.warning:C.success}}>{adjBE>CURRENT_DUES?'+$'+(adjBE-CURRENT_DUES)+'/mo':'None!'}</strong></div><div style={{fontSize:12,color:C.muted}}>{adjBE>CURRENT_DUES?'+$'+(adjBE-CURRENT_DUES)*12+'/yr per HH':'Savings cover gap'}</div></div></Card>
        </div>
      </div>
      <Card title="Phased Action Plan" accent={C.primary}><div style={{marginTop:8}}>
        {[{p:'Phase 1 — Immediate',items:['Switch to direct bank ACH — eliminate Intuit fees','Send formal demand letters to 3 delinquent owners ($1,326)','Request City of Houston water meter audit','Review irrigation schedule'],c:C.danger},
          {p:'Phase 2 — 30-60 Days',items:['Get 2-3 bids for landscaping','Get 2-3 bids for trash/recycling','Negotiate Stellar Bank fees','Monthly financial review at board meetings'],c:C.warning},
          {p:'Phase 3 — Q3 Vote',items:['Modest dues adjustment to $'+Math.min(adjBE+13,198)+'/mo ($'+(Math.min(adjBE+13,198)-168)+' increase)','Establish operating reserve fund','Annual budget review process','Continue water installment plan'],c:C.success}
        ].map(function(p,pi){return <div key={pi} style={{marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:13,color:p.c,marginBottom:6,display:'flex',alignItems:'center',gap:8}}><div style={{width:8,height:8,borderRadius:'50%',background:p.c}}/>{p.p}</div>
          <div style={{marginLeft:16}}>{p.items.map(function(it,ii){return <div key={ii} style={{fontSize:12,color:'#555',padding:'3px 0'}}><span style={{color:p.c}}>• </span>{it}</div>})}</div>
        </div>})}
      </div></Card>
    </div>}

    {tab==='water'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:16,marginBottom:16}}>
        <Card title="Water Past-Due — Installment Plan" subtitle="Enter actual balance, choose timeline" accent="#2E86AB"><div style={{marginTop:8}}>
          <Inp label="Past-Due Balance" value={waterDebt} onChange={setWaterDebt} prefix="$" suffix=" owed" hint="Enter actual City of Houston amount"/>
          <div style={{marginTop:12}}><label style={{fontSize:12,fontWeight:600,color:'#555'}}>Payoff Timeline</label>
            <div style={{display:'flex',gap:8,marginTop:6}}>{[6,12,18,24,36].map(function(m){return <button key={m} onClick={function(){setPayoffMo(m)}} style={{padding:'8px 16px',borderRadius:8,border:payoffMo===m?'2px solid '+C.primary:'1px solid #ddd',background:payoffMo===m?'#D6E4F0':'white',fontWeight:payoffMo===m?700:400,cursor:'pointer',fontSize:13}}>{m} mo</button>})}</div>
          </div>
        </div></Card>
        <div style={{display:'grid',gridTemplateRows:'1fr 1fr 1fr',gap:12}}>
          <Metric label="Total Past-Due" value={fmt(waterDebt)} color={C.primary} icon="💧"/>
          <Metric label="Monthly Payment" value={fmt2(wPmt)} sub="Added to water bill" color={C.warning} icon="📆"/>
          <Metric label="Per Household/Mo" value={fmt2(wPmt/UNITS)} sub="Temporary" color={C.danger} icon="🏠"/>
        </div>
      </div>
      <Card title="Payment Schedule" accent={C.primary}>
        <div style={{maxHeight:320,overflowY:'auto',borderRadius:8,border:'1px solid #eee'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr style={{background:C.primary,color:'white',position:'sticky',top:0}}><th style={{padding:'8px 10px',textAlign:'left'}}>Month</th><th style={{padding:'8px 10px',textAlign:'right'}}>Payment</th><th style={{padding:'8px 10px',textAlign:'right'}}>Remaining</th><th style={{padding:'8px 10px',textAlign:'right'}}>Current Water</th><th style={{padding:'8px 10px',textAlign:'right'}}>Total</th></tr></thead>
            <tbody>{schedule.map(function(r,i){return <tr key={i} style={{background:i%2===0?'#f8f9fa':'white'}}>
              <td style={{padding:'6px 10px',fontWeight:500}}>{r.month}</td>
              <td style={{padding:'6px 10px',textAlign:'right'}}>{fmt2(r.payment)}</td>
              <td style={{padding:'6px 10px',textAlign:'right',color:r.remaining>0?C.danger:C.success,fontWeight:r.remaining<1?700:400}}>{r.remaining<1?'✅ PAID OFF':fmt(Math.round(r.remaining))}</td>
              <td style={{padding:'6px 10px',textAlign:'right',color:C.muted}}>{fmt(water)}</td>
              <td style={{padding:'6px 10px',textAlign:'right',fontWeight:600}}>{fmt(Math.round(r.totalW))}</td>
            </tr>})}</tbody>
          </table>
        </div>
        <div style={{marginTop:12,background:'#E8F5E9',borderRadius:8,padding:12,fontSize:13}}><strong>After payoff ({payoffMo} months):</strong> Water drops from {fmt(Math.round(water+wPmt))} to {fmt(water)}/mo, freeing {fmt(Math.round(wPmt))}/mo ({fmt2(wPmt/UNITS)}/HH).</div>
      </Card>
    </div>}

    {tab==='collections'&&<div>
      <Card title="Accounts Receivable — March 31, 2026" subtitle="3 owners owe $1,326 combined" accent={C.warning}>
        <table style={{width:'100%',borderCollapse:'collapse',marginTop:8,fontSize:12}}>
          <thead><tr style={{background:C.primary,color:'white'}}><th style={{padding:'8px 10px',textAlign:'left'}}>Owner</th><th style={{padding:'8px 10px',textAlign:'right'}}>Current</th><th style={{padding:'8px 10px',textAlign:'right'}}>1-30</th><th style={{padding:'8px 10px',textAlign:'right'}}>31-60</th><th style={{padding:'8px 10px',textAlign:'right'}}>61-90</th><th style={{padding:'8px 10px',textAlign:'right'}}>&gt;90</th><th style={{padding:'8px 10px',textAlign:'right'}}>TOTAL</th></tr></thead>
          <tbody>
            {arRows.map(function(r,i){return <tr key={i} style={{background:r.total>500?'#FFF3F3':i%2===0?'#f8f9fa':'white'}}>
              <td style={{padding:'8px 10px',fontWeight:600}}>{r.owner}{r.total>500&&<span style={{background:C.danger,color:'white',padding:'1px 6px',borderRadius:8,fontSize:10,marginLeft:4}}>HIGH</span>}</td>
              <td style={{padding:'8px 10px',textAlign:'right'}}>{fmt(r.current)}</td>
              <td style={{padding:'8px 10px',textAlign:'right'}}>{r.d30?fmt(r.d30):'-'}</td>
              <td style={{padding:'8px 10px',textAlign:'right'}}>{r.d60?fmt(r.d60):'-'}</td>
              <td style={{padding:'8px 10px',textAlign:'right',color:r.d90?C.danger:'inherit',fontWeight:r.d90?700:400}}>{r.d90?fmt(r.d90):'-'}</td>
              <td style={{padding:'8px 10px',textAlign:'right'}}>{r.over90?fmt(r.over90):'-'}</td>
              <td style={{padding:'8px 10px',textAlign:'right',fontWeight:700,color:r.total>500?C.danger:C.dark}}>{fmt(r.total)}</td>
            </tr>})}
            <tr style={{background:C.dark,color:'white',fontWeight:700}}><td style={{padding:'8px 10px'}}>TOTAL</td><td style={{padding:'8px 10px',textAlign:'right'}}>{fmt(486)}</td><td style={{padding:'8px 10px',textAlign:'right'}}>{fmt(336)}</td><td style={{padding:'8px 10px',textAlign:'right'}}>{fmt(336)}</td><td style={{padding:'8px 10px',textAlign:'right'}}>{fmt(168)}</td><td style={{padding:'8px 10px',textAlign:'right'}}>-</td><td style={{padding:'8px 10px',textAlign:'right',fontSize:14}}>{fmt(1326)}</td></tr>
          </tbody>
        </table>
        <div style={{marginTop:16,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
          {arRows.map(function(r,i){return <div key={i} style={{background:r.total>500?'#FFF3F3':'#f8f9fa',border:'1px solid '+(r.total>500?'#FFCDD2':'#e0e0e0'),borderRadius:8,padding:12}}>
            <div style={{fontWeight:700,fontSize:13}}>{r.owner}</div>
            <div style={{fontSize:22,fontWeight:800,color:r.total>500?C.danger:C.warning,margin:'4px 0'}}>{fmt(r.total)}</div>
            <div style={{fontSize:11,color:C.muted}}>{r.d90>0?'90 days — '+Math.ceil(r.total/168)+' months behind':r.d60>0?'60 days — '+Math.ceil(r.total/168)+' months behind':'Current only'}</div>
            <div style={{marginTop:8,fontSize:11,fontWeight:600,color:r.total>500?C.danger:C.success}}>{r.total>500?'Action: Demand letter + lien':r.total>300?'Action: Demand letter':'Action: Reminder'}</div>
          </div>})}
        </div>
      </Card>
    </div>}

    <div style={{marginTop:24,padding:'14px 20px',background:'white',borderRadius:12,textAlign:'center',fontSize:12,color:C.muted}}>Martin Court Property Owners Association Inc | Community Meeting April 2026 | All inputs editable</div>
    </div>
  </div>;
}

ReactDOM.render(React.createElement(Dashboard),document.getElementById('root'));
</script>
</body>
</html>
