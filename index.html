<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Martin Court HOA — Financial Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#f0f2f5}::-webkit-scrollbar-thumb{background:#b0b8c4;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useCallback}=React;
const {BarChart,Bar,LineChart,Line,PieChart,Pie,Cell,XAxis,YAxis,CartesianGrid,Tooltip,Legend,ResponsiveContainer,AreaChart,Area}=Recharts;

// ═══════════════════════════════════════
// CONSTANTS & DATA
// ═══════════════════════════════════════
const UNITS=16, CURRENT_DUES=168;
const COLORS={primary:'#1F4E79',accent:'#2E86AB',danger:'#C0392B',warning:'#E67E22',success:'#27AE60',muted:'#95A5A6',dark:'#2C3E50',light:'#ECF0F1',gold:'#F39C12'};
const PIE_COLORS=['#1F4E79','#2E86AB','#27AE60','#E67E22','#C0392B','#8E44AD','#F39C12','#1ABC9C','#BDC3C7','#D35400','#7F8C8D'];

const plData=[
  {year:'2023',income:8652,expenses:2051,net:6550},
  {year:'2024',income:28560,expenses:19796,net:8764},
  {year:'2025',income:33768,expenses:43131,net:-9363},
  {year:'2026 Q1\n(annualized)',income:30240,expenses:39101,net:-8861},
];

const balanceData=[
  {period:'Dec 2023',cash:8182,assets:6550,equity:6550},
  {period:'Dec 2024',cash:18513,assets:15313,equity:15313},
  {period:'Dec 2025',cash:9151,assets:5951,equity:5951},
  {period:'Mar 2026',cash:6935,assets:3735,equity:3735},
];

const expenseBreakdown2025=[
  {name:'Water',value:22931,pct:53.2},
  {name:'Property Mgmt',value:6300,pct:14.6},
  {name:'Trash',value:5789,pct:13.4},
  {name:'Landscaping',value:5207,pct:12.1},
  {name:'Bank Fees',value:1132,pct:2.6},
  {name:'Insurance',value:824,pct:1.9},
  {name:'Other',value:948,pct:2.2},
];

const monthlyQ1=[
  {month:'Jan 26',income:2352,expenses:1642,net:710},
  {month:'Feb 26',income:2688,expenses:3005,net:-317},
  {month:'Mar 26',income:2520,expenses:5128,net:-2608},
];

const arData=[
  {owner:'Pacheco, Mercedes',current:162,d30:168,d60:168,d90:168,over90:0,total:666},
  {owner:'Lathaphasavang, Nicko',current:162,d30:168,d60:168,d90:0,over90:0,total:498},
  {owner:'Toller M. & Glass K.',current:162,d30:0,d60:0,d90:0,over90:0,total:162},
];

const budgetVsActual=[
  {cat:'HOA Dues (Income)',actual:7560,budget:8064},
  {cat:'Property Mgmt',actual:1575,budget:1575},
  {cat:'Water',actual:4193,budget:5958},
  {cat:'Landscaping',actual:1429,budget:1166},
  {cat:'Trash',actual:974,budget:1349},
  {cat:'Insurance',actual:623,budget:515},
  {cat:'Bank Fees',actual:257,budget:280},
  {cat:'Electric',actual:38,budget:39},
  {cat:'Prof Fees',actual:200,budget:71},
  {cat:'Violations',actual:486,budget:0},
];

const expenseDefaults={propertyMgmt:525,landscaping:401,trash:487,waterCurrent:1490,insurance:69,bankFees:93,electric:13,profFees:24,repairs:83,taxes:2};

const fmt=n=>n<0?`($${Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})})`:`$${n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}`;
const fmt2=n=>n<0?`($${Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})})`:`$${n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;

// ═══════════════════════════════════════
// REUSABLE COMPONENTS
// ═══════════════════════════════════════
function Card({children,title,subtitle,style={},accent}){
  return(
    <div className="fade-in" style={{background:'white',borderRadius:12,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',overflow:'hidden',...style}}>
      {accent&&<div style={{height:4,background:accent}}/>}
      {title&&<div style={{padding:'16px 20px 8px'}}>
        <h3 style={{fontSize:15,fontWeight:700,color:COLORS.dark,margin:0}}>{title}</h3>
        {subtitle&&<p style={{fontSize:12,color:COLORS.muted,margin:'2px 0 0'}}>{subtitle}</p>}
      </div>}
      <div style={{padding:title?'0 20px 16px':'16px 20px'}}>{children}</div>
    </div>
  );
}

function MetricCard({label,value,sub,color,bg,icon}){
  return(
    <div className="fade-in" style={{background:bg||'white',borderRadius:12,padding:'14px 16px',boxShadow:'0 2px 8px rgba(0,0,0,0.05)',borderLeft:`4px solid ${color||COLORS.primary}`}}>
      <div style={{fontSize:11,fontWeight:600,color:COLORS.muted,textTransform:'uppercase',letterSpacing:'.5px'}}>{icon} {label}</div>
      <div style={{fontSize:24,fontWeight:800,color:color||COLORS.primary,margin:'4px 0'}}>{value}</div>
      {sub&&<div style={{fontSize:11,color:COLORS.muted}}>{sub}</div>}
    </div>
  );
}

function NavTab({label,active,onClick,icon}){
  return(
    <button onClick={onClick} style={{padding:'10px 18px',border:'none',borderBottom:active?`3px solid ${COLORS.primary}`:'3px solid transparent',
      background:'none',cursor:'pointer',fontSize:13,fontWeight:active?700:400,color:active?COLORS.primary:COLORS.muted,
      transition:'all .2s',display:'flex',alignItems:'center',gap:6}}>
      <span>{icon}</span>{label}
    </button>
  );
}

function InputField({label,value,onChange,min=0,max=99999,step=1,prefix='$',suffix='/mo',hint}){
  return(
    <div style={{marginBottom:10}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <label style={{fontSize:12,fontWeight:600,color:'#555',minWidth:180}}>{label}</label>
        <span style={{fontSize:12,color:'#999'}}>{prefix}</span>
        <input type="number" value={value} onChange={e=>onChange(Number(e.target.value))} min={min} max={max} step={step}
          style={{width:95,padding:'5px 8px',border:'1px solid #ddd',borderRadius:6,fontSize:13,color:'#0000CC',fontWeight:600,outline:'none'}}/>
        <span style={{fontSize:12,color:'#999'}}>{suffix}</span>
      </div>
      {hint&&<div style={{fontSize:11,color:'#aaa',marginLeft:188,marginTop:2}}>{hint}</div>}
    </div>
  );
}

// ═══════════════════════════════════════
// MAIN DASHBOARD
// ═══════════════════════════════════════
function Dashboard(){
  const [tab,setTab]=useState('overview');
  const [dues,setDues]=useState(CURRENT_DUES);
  const [pm,setPm]=useState(expenseDefaults.propertyMgmt);
  const [land,setLand]=useState(expenseDefaults.landscaping);
  const [trash,setTrash]=useState(expenseDefaults.trash);
  const [water,setWater]=useState(expenseDefaults.waterCurrent);
  const [ins,setIns]=useState(expenseDefaults.insurance);
  const [bank,setBank]=useState(expenseDefaults.bankFees);
  const [elec,setElec]=useState(expenseDefaults.electric);
  const [prof,setProf]=useState(expenseDefaults.profFees);
  const [rep,setRep]=useState(expenseDefaults.repairs);
  const [tax,setTax]=useState(expenseDefaults.taxes);
  const [waterDebt,setWaterDebt]=useState(8000);
  const [payoffMo,setPayoffMo]=useState(18);
  const [savBank,setSavBank]=useState(65);
  const [savLand,setSavLand]=useState(0);
  const [savTrash,setSavTrash]=useState(0);
  const [arRec,setArRec]=useState(1326);

  const waterPmt=payoffMo>0?waterDebt/payoffMo:0;
  const totalExp=pm+land+trash+water+ins+bank+elec+prof+rep+tax+waterPmt;
  const totalInc=dues*UNITS;
  const monthlyNet=totalInc-totalExp;
  const breakEven=Math.ceil(totalExp/UNITS);
  const adjustedExp=totalExp-savBank-savLand-savTrash;
  const adjustedBE=Math.ceil(adjustedExp/UNITS);

  const categories=[
    {name:'Water (Current)',value:water,color:'#2E86AB'},
    {name:'Property Mgmt',value:pm,color:'#1F4E79'},
    {name:'Trash/Recycling',value:trash,color:'#E67E22'},
    {name:'Landscaping',value:land,color:'#27AE60'},
    {name:'Water Payoff',value:waterPmt,color:'#C0392B'},
    {name:'Bank Fees',value:bank,color:'#BDC3C7'},
    {name:'Repairs',value:rep,color:'#E74C3C'},
    {name:'Insurance',value:ins,color:'#8E44AD'},
    {name:'Prof Fees',value:prof,color:'#1ABC9C'},
    {name:'Electric',value:elec,color:'#F39C12'},
    {name:'Taxes',value:tax,color:'#7F8C8D'},
  ].filter(c=>c.value>0).sort((a,b)=>b.value-a.value);

  const pieData=categories.map(c=>({name:c.name,value:Math.round(c.value)}));

  const perHHData=categories.map(c=>({name:c.name,perHH:Math.round(c.value/UNITS*100)/100,total:c.value,color:c.color}));

  const payoffSchedule=useMemo(()=>{
    const months=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
    let bal=waterDebt;
    return Array.from({length:payoffMo},(_,i)=>{
      bal=Math.max(0,bal-waterPmt);
      const yr=2026+Math.floor((i+3)/12);
      const mi=(i+3)%12;
      return{month:`${months[mi]} ${yr}`,payment:waterPmt,remaining:bal,totalWater:water+waterPmt};
    });
  },[waterDebt,payoffMo,waterPmt,water]);

  const CustomTooltip=({active,payload,label})=>{
    if(!active||!payload?.length)return null;
    return(<div style={{background:'white',border:'1px solid #eee',borderRadius:8,padding:'8px 12px',boxShadow:'0 4px 12px rgba(0,0,0,.1)'}}>
      <div style={{fontWeight:700,fontSize:12,marginBottom:4}}>{label}</div>
      {payload.map((p,i)=>(<div key={i} style={{fontSize:12,color:p.color}}>{p.name}: {fmt(p.value)}</div>))}
    </div>);
  };

  return(
    <div style={{minHeight:'100vh',background:'#f0f2f5'}}>
      {/* HEADER */}
      <div style={{background:`linear-gradient(135deg,${COLORS.primary},${COLORS.accent})`,color:'white',padding:'24px 32px'}}>
        <div style={{maxWidth:1200,margin:'0 auto'}}>
          <h1 style={{fontSize:26,fontWeight:800,margin:0}}>Martin Court Property Owners Association</h1>
          <h2 style={{fontSize:16,fontWeight:400,margin:'4px 0 0',opacity:.85}}>Financial Dashboard & Budget Planning Tool</h2>
          <div style={{marginTop:8,fontSize:12,opacity:.7}}>Prepared for Community Meeting — April 2026 &nbsp;|&nbsp; 16 Households &nbsp;|&nbsp; Cash Basis Reporting</div>
        </div>
      </div>

      {/* NAVIGATION */}
      <div style={{background:'white',boxShadow:'0 2px 8px rgba(0,0,0,.06)',position:'sticky',top:0,zIndex:100}}>
        <div style={{maxWidth:1200,margin:'0 auto',display:'flex',overflowX:'auto'}}>
          <NavTab label="Financial Overview" icon="📊" active={tab==='overview'} onClick={()=>setTab('overview')}/>
          <NavTab label="Where Your Dues Go" icon="💰" active={tab==='breakdown'} onClick={()=>setTab('breakdown')}/>
          <NavTab label="Budget vs Actual" icon="📋" active={tab==='budget'} onClick={()=>setTab('budget')}/>
          <NavTab label="What-If Scenarios" icon="🔧" active={tab==='whatif'} onClick={()=>setTab('whatif')}/>
          <NavTab label="Cost Savings Plan" icon="✅" active={tab==='plan'} onClick={()=>setTab('plan')}/>
          <NavTab label="Water Payoff" icon="💧" active={tab==='water'} onClick={()=>setTab('water')}/>
          <NavTab label="Collections" icon="📨" active={tab==='collections'} onClick={()=>setTab('collections')}/>
        </div>
      </div>

      <div style={{maxWidth:1200,margin:'0 auto',padding:'20px 16px'}}>

      {/* ═══════ OVERVIEW TAB ═══════ */}
      {tab==='overview'&&(<div>
        {/* Alert Banner */}
        <div className="fade-in" style={{background:'#FEF3CD',border:'1px solid #F0C000',borderRadius:10,padding:'14px 20px',marginBottom:20,display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:24}}>⚠️</span>
          <div>
            <div style={{fontWeight:700,fontSize:14,color:COLORS.dark}}>Financial Action Required</div>
            <div style={{fontSize:13,color:'#666',marginTop:2}}>The HOA has been operating at a deficit since 2025. Total equity has dropped from $15,313 to $3,735 in 15 months. This dashboard presents the full financial picture and a concrete plan to restore stability without a significant dues increase.</div>
          </div>
        </div>

        {/* Metric Cards */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12,marginBottom:20}}>
          <MetricCard label="Cash in Bank" value={fmt(6935)} sub="As of March 31, 2026" color={COLORS.warning} icon="🏦"/>
          <MetricCard label="Total Net Assets" value={fmt(3735)} sub="Down from $15,313 in Dec 2024" color={COLORS.danger} icon="📉"/>
          <MetricCard label="2025 Net Loss" value={fmt(-9363)} sub="Expenses exceeded income" color={COLORS.danger} icon="🔻"/>
          <MetricCard label="Q1 2026 Net" value={fmt(-2215)} sub="3-month operating loss" color={COLORS.danger} icon="📊"/>
          <MetricCard label="Unpaid Dues" value={fmt(1326)} sub="3 owners past due" color={COLORS.warning} icon="📨"/>
        </div>

        {/* Charts Row */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
          <Card title="Income vs Expenses — Year Over Year" subtitle="The 2025 expense spike is driven primarily by water costs" accent={COLORS.primary}>
            <ResponsiveContainer width="100%" height={260}>
              <BarChart data={plData} margin={{top:10,right:10,left:0,bottom:5}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
                <XAxis dataKey="year" fontSize={11}/>
                <YAxis fontSize={11} tickFormatter={v=>`$${(v/1000).toFixed(0)}K`}/>
                <Tooltip content={<CustomTooltip/>}/>
                <Legend wrapperStyle={{fontSize:12}}/>
                <Bar dataKey="income" name="Income" fill={COLORS.primary} radius={[4,4,0,0]}/>
                <Bar dataKey="expenses" name="Expenses" fill={COLORS.danger} radius={[4,4,0,0]}/>
              </BarChart>
            </ResponsiveContainer>
          </Card>

          <Card title="Cash & Equity Trend" subtitle="Reserves peaked Dec 2024 and have been declining since" accent={COLORS.accent}>
            <ResponsiveContainer width="100%" height={260}>
              <AreaChart data={balanceData} margin={{top:10,right:10,left:0,bottom:5}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
                <XAxis dataKey="period" fontSize={11}/>
                <YAxis fontSize={11} tickFormatter={v=>`$${(v/1000).toFixed(0)}K`}/>
                <Tooltip content={<CustomTooltip/>}/>
                <Legend wrapperStyle={{fontSize:12}}/>
                <Area dataKey="cash" name="Cash" fill={COLORS.primary} fillOpacity={0.2} stroke={COLORS.primary} strokeWidth={2}/>
                <Area dataKey="equity" name="Net Equity" fill={COLORS.success} fillOpacity={0.15} stroke={COLORS.success} strokeWidth={2}/>
              </AreaChart>
            </ResponsiveContainer>
          </Card>
        </div>

        {/* Expense Pie + Q1 Monthly */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <Card title="2025 Expense Distribution" subtitle="Water alone consumed 53% of all spending" accent={COLORS.danger}>
            <ResponsiveContainer width="100%" height={280}>
              <PieChart>
                <Pie data={expenseBreakdown2025} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={55} outerRadius={95}
                  label={({name,pct})=>`${name} ${pct}%`} labelLine={true} fontSize={11}>
                  {expenseBreakdown2025.map((_,i)=><Cell key={i} fill={PIE_COLORS[i%PIE_COLORS.length]}/>)}
                </Pie>
                <Tooltip formatter={v=>fmt(v)}/>
              </PieChart>
            </ResponsiveContainer>
          </Card>

          <Card title="Q1 2026 — Monthly Performance" subtitle="March was hit hardest by water catch-up payments" accent={COLORS.warning}>
            <ResponsiveContainer width="100%" height={220}>
              <BarChart data={monthlyQ1} margin={{top:10,right:10,left:0,bottom:5}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
                <XAxis dataKey="month" fontSize={12}/>
                <YAxis fontSize={11} tickFormatter={v=>fmt(v)}/>
                <Tooltip content={<CustomTooltip/>}/>
                <Legend wrapperStyle={{fontSize:12}}/>
                <Bar dataKey="income" name="Income" fill={COLORS.primary} radius={[4,4,0,0]}/>
                <Bar dataKey="expenses" name="Expenses" fill={COLORS.warning} radius={[4,4,0,0]}/>
              </BarChart>
            </ResponsiveContainer>
            <div style={{textAlign:'center',marginTop:8}}>
              {monthlyQ1.map((m,i)=>(
                <span key={i} style={{display:'inline-block',margin:'0 12px',fontSize:12}}>
                  <strong>{m.month}:</strong> <span style={{color:m.net>=0?COLORS.success:COLORS.danger,fontWeight:700}}>{fmt(m.net)}</span>
                </span>
              ))}
            </div>
          </Card>
        </div>

        {/* Key Findings */}
        <Card title="Key Findings" style={{marginTop:16}} accent={COLORS.dark}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {[
              {icon:'💧',title:'Water costs are the #1 driver',desc:'$22,931 in 2025 — there is a past-due balance with the City of Houston being paid down in installments. Current monthly usage is approximately $1,490.'},
              {icon:'📉',title:'Structural deficit of ~$10K/year',desc:'At $168/month, dues generate ~$32K/year but normal operating costs are ~$42K. The gap existed before the water past-due issue.'},
              {icon:'🏦',title:'Cash reserves critically low',desc:'Only $6,935 in the bank with a -$3,200 unfunded operating reserve. At the current burn rate, roughly 9 months of cash remain.'},
              {icon:'💳',title:'Bank fees are excessive',desc:'Intuit charges $5.46 per ACH transaction for every dues payment. Switching to direct bank ACH could save $780+/year.'},
            ].map((f,i)=>(
              <div key={i} style={{background:'#f8f9fa',borderRadius:8,padding:'12px 14px'}}>
                <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{f.icon} {f.title}</div>
                <div style={{fontSize:12,color:'#666',lineHeight:1.5}}>{f.desc}</div>
              </div>
            ))}
          </div>
        </Card>
      </div>)}

      {/* ═══════ BREAKDOWN TAB ═══════ */}
      {tab==='breakdown'&&(<div>
        <Card title={`Where Every Dollar of Your $${dues} Monthly Dues Goes`} subtitle={`Total monthly HOA cost per household: ${fmt2(totalExp/UNITS)} — split across ${categories.length} expense categories`} accent={COLORS.primary}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginTop:8}}>
            <div>
              {perHHData.map((c,i)=>(
                <div key={i} style={{marginBottom:8}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:2}}>
                    <span style={{fontWeight:500}}>{c.name}</span>
                    <span><strong style={{color:c.color}}>{fmt2(c.perHH)}</strong> <span style={{color:'#aaa'}}>/ household</span></span>
                  </div>
                  <div style={{background:'#f0f0f0',borderRadius:4,height:20,overflow:'hidden'}}>
                    <div style={{width:`${Math.min(c.perHH/(totalExp/UNITS)*100,100)}%`,background:c.color,height:'100%',borderRadius:4,transition:'width .3s',
                      display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:4}}>
                      <span style={{fontSize:10,color:'white',fontWeight:600}}>{Math.round(c.perHH/(totalExp/UNITS)*1000)/10}%</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
            <div>
              <ResponsiveContainer width="100%" height={300}>
                <PieChart>
                  <Pie data={pieData} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={50} outerRadius={100}
                    label={({name,percent})=>`${name} ${(percent*100).toFixed(0)}%`} fontSize={11}>
                    {pieData.map((_,i)=><Cell key={i} fill={categories[i]?.color||PIE_COLORS[i]}/>)}
                  </Pie>
                  <Tooltip formatter={v=>`${fmt(v)}/mo`}/>
                </PieChart>
              </ResponsiveContainer>
            </div>
          </div>

          <div style={{marginTop:16,background:'#f8f9fa',borderRadius:8,padding:14}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,textAlign:'center'}}>
              <div>
                <div style={{fontSize:11,fontWeight:600,color:COLORS.muted}}>COST PER HOUSEHOLD</div>
                <div style={{fontSize:22,fontWeight:800,color:COLORS.danger}}>{fmt2(totalExp/UNITS)}</div>
              </div>
              <div>
                <div style={{fontSize:11,fontWeight:600,color:COLORS.muted}}>DUES COLLECTED</div>
                <div style={{fontSize:22,fontWeight:800,color:COLORS.primary}}>{fmt2(dues)}</div>
              </div>
              <div>
                <div style={{fontSize:11,fontWeight:600,color:COLORS.muted}}>MONTHLY GAP</div>
                <div style={{fontSize:22,fontWeight:800,color:monthlyNet>=0?COLORS.success:COLORS.danger}}>{fmt2(dues-totalExp/UNITS)}</div>
              </div>
            </div>
          </div>

          {/* Bank Fees Explainer */}
          <div style={{marginTop:14,background:'#FFF8E1',border:'1px solid #FFE082',borderRadius:8,padding:12,fontSize:12}}>
            <strong>What are "Bank & Processing Fees"?</strong> This is the combination of Stellar Bank's monthly Account Analysis Charge ($25.75/mo) plus Intuit/QuickBooks ACH processing fees ($5.46 per transaction charged every time a homeowner's dues payment is deposited). With 16 units paying throughout the month, those per-transaction fees total approximately $67/month.
          </div>
        </Card>
      </div>)}

      {/* ═══════ BUDGET VS ACTUAL TAB ═══════ */}
      {tab==='budget'&&(<div>
        <Card title="Q1 2026 — Budget vs Actual" subtitle="January through March 2026 performance against approved budget" accent={COLORS.primary}>
          <ResponsiveContainer width="100%" height={320}>
            <BarChart data={budgetVsActual} layout="vertical" margin={{top:5,right:20,left:100,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
              <XAxis type="number" fontSize={11} tickFormatter={v=>fmt(v)}/>
              <YAxis dataKey="cat" type="category" fontSize={11} width={95}/>
              <Tooltip content={<CustomTooltip/>}/>
              <Legend wrapperStyle={{fontSize:12}}/>
              <Bar dataKey="actual" name="Q1 Actual" fill={COLORS.primary} radius={[0,4,4,0]}/>
              <Bar dataKey="budget" name="Q1 Budget" fill={COLORS.muted} radius={[0,4,4,0]}/>
            </BarChart>
          </ResponsiveContainer>

          <table style={{width:'100%',borderCollapse:'collapse',marginTop:16,fontSize:12}}>
            <thead>
              <tr style={{background:COLORS.primary,color:'white'}}>
                {['Category','Q1 Actual','Q1 Budget','Variance','Status'].map(h=><th key={h} style={{padding:'8px 10px',textAlign:h==='Category'?'left':'right'}}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {budgetVsActual.map((r,i)=>{
                const variance=r.actual-r.budget;
                const isIncome=r.cat.includes('Income');
                const bad=isIncome?(variance<0):(variance>100);
                return(
                  <tr key={i} style={{background:i%2===0?'#f8f9fa':'white',borderBottom:'1px solid #eee'}}>
                    <td style={{padding:'7px 10px',fontWeight:500}}>{r.cat}</td>
                    <td style={{padding:'7px 10px',textAlign:'right'}}>{fmt(r.actual)}</td>
                    <td style={{padding:'7px 10px',textAlign:'right',color:COLORS.muted}}>{fmt(r.budget)}</td>
                    <td style={{padding:'7px 10px',textAlign:'right',color:bad?COLORS.danger:COLORS.success,fontWeight:600}}>
                      {variance>=0?'+':''}{fmt(variance)}
                    </td>
                    <td style={{padding:'7px 10px',textAlign:'right'}}>
                      <span style={{background:bad?'#FFC7CE':'#C6EFCE',color:bad?COLORS.danger:COLORS.success,padding:'2px 8px',borderRadius:10,fontSize:11,fontWeight:600}}>
                        {bad?'Over':'On Track'}
                      </span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>

          <div style={{marginTop:12,fontSize:12,color:'#888',lineHeight:1.6}}>
            <strong>Notes:</strong> January trash was auto-drafted in Dec 2025. February water is current billing only. Effective March, payments began toward the past-due water balance. Professional fee is an annual charge paid in March. Owner violation fees were billed in late March — revenue will appear in Q2.
          </div>
        </Card>
      </div>)}

      {/* ═══════ WHAT-IF TAB ═══════ */}
      {tab==='whatif'&&(<div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
          <MetricCard label="Current Monthly Income" value={fmt(totalInc)} sub={`${UNITS} units × $${dues}`} color={COLORS.primary} icon="📈"/>
          <MetricCard label="Current Monthly Expenses" value={fmt(Math.round(totalExp))} sub={`Break-even: $${breakEven}/household`} color={COLORS.danger} icon="📉"/>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <Card title="Adjust Monthly Dues" accent={COLORS.primary}>
            <div style={{marginTop:8}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <input type="range" min={150} max={260} value={dues} onChange={e=>setDues(Number(e.target.value))} style={{flex:1,height:6}}/>
                <span style={{fontSize:28,fontWeight:800,color:'#0000CC',minWidth:70}}>${dues}</span>
              </div>
              <div style={{fontSize:12,color:COLORS.muted,marginTop:4}}>
                {dues===CURRENT_DUES?'No change from current dues':(
                  <span style={{color:dues>CURRENT_DUES?COLORS.success:COLORS.danger}}>
                    {dues>CURRENT_DUES?'+':''}{dues-CURRENT_DUES}/mo per household ({dues>CURRENT_DUES?'+':''}${(dues-CURRENT_DUES)*12}/year)
                  </span>
                )}
              </div>
            </div>
          </Card>

          <Card title="Impact Summary" accent={monthlyNet>=0?COLORS.success:COLORS.danger}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,textAlign:'center',marginTop:8}}>
              <div><div style={{fontSize:10,color:COLORS.muted}}>ANNUAL INCOME</div><div style={{fontSize:18,fontWeight:700,color:COLORS.primary}}>{fmt(totalInc*12)}</div></div>
              <div><div style={{fontSize:10,color:COLORS.muted}}>ANNUAL EXPENSES</div><div style={{fontSize:18,fontWeight:700,color:COLORS.warning}}>{fmt(Math.round(totalExp*12))}</div></div>
              <div><div style={{fontSize:10,color:COLORS.muted}}>ANNUAL NET</div><div style={{fontSize:22,fontWeight:800,color:monthlyNet*12>=0?COLORS.success:COLORS.danger}}>{fmt(Math.round(monthlyNet*12))}</div></div>
            </div>
          </Card>
        </div>

        <Card title="Adjust Monthly Expenses" subtitle="Edit any line item to model different scenarios" style={{marginTop:16}} accent={COLORS.warning}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginTop:8}}>
            <div>
              <InputField label="Property Management" value={pm} onChange={setPm} hint="LLA Partners contract — $525/mo"/>
              <InputField label="Landscaping" value={land} onChange={setLand} hint="Saint Clair & Sons — ~$401/mo"/>
              <InputField label="Trash / Recycling" value={trash} onChange={setTrash} hint="Texas Pride Disposal — ~$487/mo"/>
              <InputField label="Water (Current Usage)" value={water} onChange={setWater} hint="City of Houston — est. $1,490/mo"/>
              <InputField label="Insurance" value={ins} onChange={setIns} hint="Annual $824 ÷ 12 months"/>
            </div>
            <div>
              <InputField label="Bank & Processing Fees" value={bank} onChange={setBank} hint="Stellar $26/mo + Intuit $5.46/transaction"/>
              <InputField label="Electric" value={elec} onChange={setElec} hint="NRG Business — ~$13/mo"/>
              <InputField label="Professional Fees" value={prof} onChange={setProf} hint="Anne Beauregard — ~$24/mo average"/>
              <InputField label="Repairs Reserve" value={rep} onChange={setRep} hint="Budget allocation for maintenance"/>
              <InputField label="Water Past-Due Payment" value={Math.round(waterPmt)} onChange={()=>{}} hint={`$${waterDebt.toLocaleString()} ÷ ${payoffMo} months (edit in Water Payoff tab)`} suffix="/mo"/>
            </div>
          </div>
        </Card>
      </div>)}

      {/* ═══════ COST SAVINGS PLAN TAB ═══════ */}
      {tab==='plan'&&(<div>
        <div className="fade-in" style={{background:'linear-gradient(135deg,#E8F5E9,#C8E6C9)',borderRadius:12,padding:'16px 20px',marginBottom:20}}>
          <div style={{fontSize:16,fontWeight:700,color:COLORS.dark}}>Strategy: Minimize Dues Increase Through Cost Optimization</div>
          <div style={{fontSize:13,color:'#555',marginTop:4}}>By pursuing savings on bank fees, vendor contracts, and collections before raising dues, we can close most of the budget gap. Adjust the levers below to model the combined impact.</div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
          <Card title="Savings Levers — Adjust to Model" accent={COLORS.success}>
            <div style={{marginTop:8}}>
              <InputField label="Bank fee savings" value={savBank} onChange={setSavBank} suffix="/mo"
                hint="Switch to direct ACH debit — eliminates Intuit fees (~$65/mo)"/>
              <InputField label="Landscaping savings" value={savLand} onChange={setSavLand} suffix="/mo"
                hint="Rebid contract — potential 10-20% ($40-80/mo)"/>
              <InputField label="Trash contract savings" value={savTrash} onChange={setSavTrash} suffix="/mo"
                hint="Shop competitors — potential 5-15% ($25-75/mo)"/>
              <InputField label="AR Recovery (one-time)" value={arRec} onChange={setArRec} suffix=" total"
                hint="$1,326 outstanding — pursue formal collections"/>
              <div style={{marginTop:12,background:'#E8F5E9',borderRadius:8,padding:10,fontSize:13}}>
                <strong>Total Monthly Savings: </strong>
                <span style={{color:COLORS.success,fontWeight:700,fontSize:16}}>{fmt(savBank+savLand+savTrash)}/mo</span>
                <span style={{color:'#888'}}> ({fmt((savBank+savLand+savTrash)*12)}/year)</span>
              </div>
            </div>
          </Card>

          <div>
            <div style={{display:'grid',gridTemplateRows:'1fr 1fr',gap:16,height:'100%'}}>
              <Card accent={COLORS.danger}>
                <div style={{textAlign:'center'}}>
                  <div style={{fontSize:11,fontWeight:700,color:COLORS.danger,textTransform:'uppercase'}}>Without Cost Savings</div>
                  <div style={{fontSize:28,fontWeight:800,color:COLORS.danger,margin:'8px 0'}}>${breakEven}/mo</div>
                  <div style={{fontSize:13}}>Required increase: <strong>+${breakEven-CURRENT_DUES}/mo</strong></div>
                  <div style={{fontSize:12,color:COLORS.muted}}>+${(breakEven-CURRENT_DUES)*12}/year per household</div>
                </div>
              </Card>
              <Card accent={COLORS.success}>
                <div style={{textAlign:'center'}}>
                  <div style={{fontSize:11,fontWeight:700,color:COLORS.success,textTransform:'uppercase'}}>With Cost Savings Applied</div>
                  <div style={{fontSize:28,fontWeight:800,color:COLORS.success,margin:'8px 0'}}>${adjustedBE}/mo</div>
                  <div style={{fontSize:13}}>Required increase: <strong style={{color:adjustedBE>CURRENT_DUES?COLORS.warning:COLORS.success}}>
                    {adjustedBE>CURRENT_DUES?`+$${adjustedBE-CURRENT_DUES}/mo`:'None!'}
                  </strong></div>
                  <div style={{fontSize:12,color:COLORS.muted}}>
                    {adjustedBE>CURRENT_DUES?`+$${(adjustedBE-CURRENT_DUES)*12}/year per household`:'Savings cover the gap'}
                  </div>
                </div>
              </Card>
            </div>
          </div>
        </div>

        <Card title="Recommended Action Plan — Phased Approach" accent={COLORS.primary}>
          <div style={{marginTop:8}}>
            {[
              {phase:'Phase 1 — Immediate (April)',items:['Switch dues collection to direct bank ACH — eliminate Intuit transaction fees','Send formal demand letters to 3 delinquent owners ($1,326)','Request City of Houston water meter audit — check for leaks','Review irrigation schedule — reduce watering if excessive'],color:COLORS.danger},
              {phase:'Phase 2 — 30-60 Days',items:['Get 2-3 competitive bids for landscaping services','Get 2-3 competitive bids for trash/recycling','Negotiate Stellar Bank account fees','Implement monthly financial review process at board meetings'],color:COLORS.warning},
              {phase:'Phase 3 — Q3 Vote',items:[`Propose modest dues adjustment to $${Math.min(adjustedBE+13,198)}/mo ($${Math.min(adjustedBE+13,198)-168} increase) — covers operations + builds reserve`,'Establish formal operating reserve fund (target: 3 months expenses)','Set up annual budget review and approval process','Water past-due balance: continue installment plan until paid off'],color:COLORS.success},
            ].map((p,pi)=>(
              <div key={pi} style={{marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:13,color:p.color,marginBottom:6,display:'flex',alignItems:'center',gap:8}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:p.color}}/>
                  {p.phase}
                </div>
                <div style={{marginLeft:16}}>
                  {p.items.map((item,ii)=>(
                    <div key={ii} style={{fontSize:12,color:'#555',padding:'3px 0',display:'flex',alignItems:'flex-start',gap:6}}>
                      <span style={{color:p.color}}>•</span>{item}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>)}

      {/* ═══════ WATER PAYOFF TAB ═══════ */}
      {tab==='water'&&(<div>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:16,marginBottom:16}}>
          <Card title="Water Past-Due Balance — Installment Plan" subtitle="Enter the actual balance owed and choose your payoff timeline" accent='#2E86AB'>
            <div style={{marginTop:8}}>
              <InputField label="Total Past-Due Balance" value={waterDebt} onChange={setWaterDebt} prefix="$" suffix=" owed"
                hint="Enter the actual amount from City of Houston — this is a placeholder"/>
              <div style={{marginTop:12,marginBottom:8}}>
                <label style={{fontSize:12,fontWeight:600,color:'#555'}}>Payoff Timeline</label>
                <div style={{display:'flex',gap:8,marginTop:6}}>
                  {[6,12,18,24,36].map(m=>(
                    <button key={m} onClick={()=>setPayoffMo(m)} style={{padding:'8px 16px',borderRadius:8,
                      border:payoffMo===m?`2px solid ${COLORS.primary}`:'1px solid #ddd',
                      background:payoffMo===m?'#D6E4F0':'white',fontWeight:payoffMo===m?700:400,
                      cursor:'pointer',fontSize:13,transition:'all .2s'}}>{m} months</button>
                  ))}
                </div>
              </div>
            </div>
          </Card>
          <div style={{display:'grid',gridTemplateRows:'1fr 1fr 1fr',gap:12}}>
            <MetricCard label="Total Past-Due" value={fmt(waterDebt)} color={COLORS.primary} icon="💧"/>
            <MetricCard label="Monthly Payment" value={fmt2(waterPmt)} sub="Added to current water bill" color={COLORS.warning} icon="📆"/>
            <MetricCard label="Per Household/Mo" value={fmt2(waterPmt/UNITS)} sub="Temporary — drops off after payoff" color={COLORS.danger} icon="🏠"/>
          </div>
        </div>

        <Card title="Payment Schedule" accent={COLORS.primary}>
          <div style={{maxHeight:320,overflowY:'auto',borderRadius:8,border:'1px solid #eee'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:COLORS.primary,color:'white',position:'sticky',top:0}}>
                  {['Month','Installment','Remaining Balance','Current Water','Total Water Cost'].map(h=>
                    <th key={h} style={{padding:'8px 10px',textAlign:h==='Month'?'left':'right'}}>{h}</th>
                  )}
                </tr>
              </thead>
              <tbody>
                {payoffSchedule.map((r,i)=>(
                  <tr key={i} style={{background:i%2===0?'#f8f9fa':'white',borderBottom:'1px solid #eee'}}>
                    <td style={{padding:'6px 10px',fontWeight:500}}>{r.month}</td>
                    <td style={{padding:'6px 10px',textAlign:'right'}}>{fmt2(r.payment)}</td>
                    <td style={{padding:'6px 10px',textAlign:'right',color:r.remaining>0?COLORS.danger:COLORS.success,fontWeight:r.remaining===0?700:400}}>
                      {r.remaining<1?'✅ PAID OFF':fmt(Math.round(r.remaining))}
                    </td>
                    <td style={{padding:'6px 10px',textAlign:'right',color:COLORS.muted}}>{fmt(water)}</td>
                    <td style={{padding:'6px 10px',textAlign:'right',fontWeight:600}}>{fmt(Math.round(r.totalWater))}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{marginTop:12,background:'#E8F5E9',borderRadius:8,padding:12,fontSize:13}}>
            <strong>After payoff ({payoffMo} months):</strong> Monthly water drops from {fmt(Math.round(water+waterPmt))} to {fmt(water)}, freeing up {fmt(Math.round(waterPmt))}/month ({fmt2(waterPmt/UNITS)} per household). This creates room to either reduce dues or accelerate reserve funding.
          </div>
        </Card>
      </div>)}

      {/* ═══════ COLLECTIONS TAB ═══════ */}
      {tab==='collections'&&(<div>
        <Card title="Accounts Receivable Aging — As of March 31, 2026" subtitle="Three homeowners owe a combined $1,326 in unpaid dues" accent={COLORS.warning}>
          <table style={{width:'100%',borderCollapse:'collapse',marginTop:8,fontSize:12}}>
            <thead>
              <tr style={{background:COLORS.primary,color:'white'}}>
                {['Owner','Current','1-30 Days','31-60 Days','61-90 Days','> 90 Days','TOTAL'].map(h=>
                  <th key={h} style={{padding:'8px 10px',textAlign:h==='Owner'?'left':'right'}}>{h}</th>
                )}
              </tr>
            </thead>
            <tbody>
              {arData.map((r,i)=>(
                <tr key={i} style={{background:r.total>500?'#FFF3F3':i%2===0?'#f8f9fa':'white',borderBottom:'1px solid #eee'}}>
                  <td style={{padding:'8px 10px',fontWeight:600}}>{r.owner} {r.total>500&&<span style={{background:COLORS.danger,color:'white',padding:'1px 6px',borderRadius:8,fontSize:10,marginLeft:4}}>HIGH</span>}</td>
                  <td style={{padding:'8px 10px',textAlign:'right'}}>{fmt(r.current)}</td>
                  <td style={{padding:'8px 10px',textAlign:'right'}}>{r.d30?fmt(r.d30):'-'}</td>
                  <td style={{padding:'8px 10px',textAlign:'right'}}>{r.d60?fmt(r.d60):'-'}</td>
                  <td style={{padding:'8px 10px',textAlign:'right',color:r.d90?COLORS.danger:'inherit',fontWeight:r.d90?700:400}}>{r.d90?fmt(r.d90):'-'}</td>
                  <td style={{padding:'8px 10px',textAlign:'right'}}>{r.over90?fmt(r.over90):'-'}</td>
                  <td style={{padding:'8px 10px',textAlign:'right',fontWeight:700,color:r.total>500?COLORS.danger:COLORS.dark}}>{fmt(r.total)}</td>
                </tr>
              ))}
              <tr style={{background:COLORS.dark,color:'white',fontWeight:700}}>
                <td style={{padding:'8px 10px'}}>TOTAL</td>
                <td style={{padding:'8px 10px',textAlign:'right'}}>{fmt(486)}</td>
                <td style={{padding:'8px 10px',textAlign:'right'}}>{fmt(336)}</td>
                <td style={{padding:'8px 10px',textAlign:'right'}}>{fmt(336)}</td>
                <td style={{padding:'8px 10px',textAlign:'right'}}>{fmt(168)}</td>
                <td style={{padding:'8px 10px',textAlign:'right'}}>-</td>
                <td style={{padding:'8px 10px',textAlign:'right',fontSize:14}}>{fmt(1326)}</td>
              </tr>
            </tbody>
          </table>

          <div style={{marginTop:16,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
            {arData.map((r,i)=>(
              <div key={i} style={{background:r.total>500?'#FFF3F3':'#f8f9fa',border:`1px solid ${r.total>500?'#FFCDD2':'#e0e0e0'}`,borderRadius:8,padding:12}}>
                <div style={{fontWeight:700,fontSize:13}}>{r.owner}</div>
                <div style={{fontSize:22,fontWeight:800,color:r.total>500?COLORS.danger:COLORS.warning,margin:'4px 0'}}>{fmt(r.total)}</div>
                <div style={{fontSize:11,color:COLORS.muted}}>
                  {r.d90>0?`90 days delinquent — ${Math.ceil(r.total/168)} months behind`:r.d60>0?`60 days delinquent — ${Math.ceil(r.total/168)} months behind`:`Current month only`}
                </div>
                <div style={{marginTop:8,fontSize:11,fontWeight:600,color:r.total>500?COLORS.danger:COLORS.success}}>
                  {r.total>500?'Action: Formal demand letter + lien consideration':r.total>300?'Action: Formal demand letter':'Action: Standard reminder notice'}
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>)}

      {/* FOOTER */}
      <div style={{marginTop:24,padding:'14px 20px',background:'white',borderRadius:12,textAlign:'center',fontSize:12,color:COLORS.muted}}>
        Martin Court Property Owners Association Inc &nbsp;|&nbsp; Financial Dashboard prepared for Community Meeting — April 2026<br/>
        All figures based on QuickBooks P&L, Balance Sheet, and bank records &nbsp;|&nbsp; All inputs are editable — adjust values to model scenarios
      </div>

      </div>
    </div>
  );
}

ReactDOM.render(<Dashboard/>,document.getElementById('root'));
</script>
</body>
</html>
